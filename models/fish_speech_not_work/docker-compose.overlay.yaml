services:
  vllm-omni:
    container_name: vllm-omni-rocm-fish-speech
    command: >
      /models/s2-pro
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
    ports:
      - "8103:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/s2-pro:/models/s2-pro:ro
      - /home/hermes/workspace:/workspace:ro
