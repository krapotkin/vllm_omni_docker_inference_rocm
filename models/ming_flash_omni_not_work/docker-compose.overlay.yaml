services:
  vllm-omni:
    container_name: vllm-omni-rocm-ming-flash-omni
    command: >
      /models/Ming-flash-omni-2.0
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
      --deploy-config vllm_omni/deploy/ming_flash_omni_tts.yaml
    ports:
      - "8098:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/Ming-flash-omni-2.0:/models/Ming-flash-omni-2.0:ro
      - /home/hermes/workspace:/workspace:ro
