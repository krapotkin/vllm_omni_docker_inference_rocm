services:
  vllm-omni:
    container_name: vllm-omni-rocm-glm-tts
    command: >
      /models/GLM-TTS
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
    ports:
      - "8096:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/GLM-TTS:/models/GLM-TTS:ro
      - /home/hermes/workspace:/workspace:ro
