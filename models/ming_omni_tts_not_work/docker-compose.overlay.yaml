services:
  vllm-omni:
    container_name: vllm-omni-rocm-ming-omni-tts
    command: >
      /models/Ming-omni-tts-0.5B
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
      --deploy-config vllm_omni/deploy/ming_tts.yaml
    ports:
      - "8097:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/Ming-omni-tts-0.5B:/models/Ming-omni-tts-0.5B:ro
      - /home/hermes/workspace:/workspace:ro
