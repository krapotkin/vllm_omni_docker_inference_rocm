version: '2.3'

services:
  vllm-omni:
    container_name: vllm-omni-rocm-omnivoice
    command: >
      /models/OmniVoice
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
    ports:
      - "8100:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/OmniVoice:/models/OmniVoice:ro
      - /home/hermes/workspace:/workspace:ro
    shm_size: '8gb'
    ipc: host
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - "video"
      - "render"
    stdin_open: true
    tty: true
