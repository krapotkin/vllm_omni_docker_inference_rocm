services:
  vllm-omni:
    container_name: vllm-omni-rocm-qwen3-tts-base-0.6b
    command: >
      /models/Qwen3-TTS-12Hz-0.6B-Base
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
    ports:
      - "8093:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/Qwen3-TTS-12Hz-0.6B-Base:/models/Qwen3-TTS-12Hz-0.6B-Base:ro
      - /home/hermes/workspace:/workspace:ro
