services:
  vllm-omni:
    container_name: vllm-omni-rocm-voxtral-tts
    command: >
      /models/Voxtral-4B-TTS-2603
      --omni
      --host 0.0.0.0
      --port 8000
      --trust-remote-code
      --gpu-memory-utilization 0.35
      --enforce-eager
      --allowed-local-media-path /workspace
    ports:
      - "8102:8000"
    volumes:
      - /home/hermes/workspace/models/models_tts/Voxtral-4B-TTS-2603:/models/Voxtral-4B-TTS-2603:ro
      - /home/hermes/workspace:/workspace:ro
